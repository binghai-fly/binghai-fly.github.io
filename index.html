<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>乌坦城 · 剑影前厅</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0710;color:#f0d488;font-family:"Noto Serif SC","Songti SC",serif}
  #stage{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;transition:opacity .55s ease}
  #game{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:1;opacity:0;pointer-events:none;transition:opacity .65s ease;background:#000}
  .hud{position:fixed;z-index:3;left:0;right:0;pointer-events:none;text-align:center}
  .title{top:5.2vh;font-size:clamp(18px,2.1vw,30px);letter-spacing:.55em;text-indent:.55em;text-shadow:0 2px 18px rgba(0,0,0,.8);color:#f4df9e}
  .subtitle{top:calc(5.2vh + 38px);font-size:12px;letter-spacing:.18em;color:#b9aec9}
  .hint{top:calc(5.2vh + 62px);font-size:11px;letter-spacing:.08em;color:#817490}
  .bottom{bottom:0;padding:0 0 5vh}
  .status{font-size:12px;letter-spacing:.08em;color:#d8c7a0;margin-bottom:9px;text-shadow:0 1px 6px #000}
  .bar{width:min(420px,72vw);height:4px;margin:0 auto;background:rgba(255,255,255,.09);border-radius:99px;overflow:hidden;box-shadow:0 0 18px rgba(240,212,136,.12)}
  .bar i{display:block;height:100%;width:12%;background:linear-gradient(90deg,#42628a,#9fc3e2,#f0d488);transition:width .4s ease;box-shadow:0 0 12px rgba(159,195,226,.55)}
  .keys{bottom:2.2vh;font-size:10px;letter-spacing:.08em;color:#665b74}
  .reveal{position:fixed;z-index:4;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,3,9,.35);opacity:0;pointer-events:none;transition:opacity .4s ease}
  .reveal.on{opacity:1;pointer-events:auto}
  .reveal button{background:linear-gradient(180deg,#f2d58c,#c69b4c);border:1px solid #f7e3a8;color:#17101d;border-radius:8px;padding:12px 30px;font:600 15px "Noto Serif SC",serif;letter-spacing:.18em;cursor:pointer;box-shadow:0 8px 30px rgba(0,0,0,.55)}
  .reveal .tip{position:absolute;bottom:24vh;font-size:11px;color:#c9bdd4;letter-spacing:.12em}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<iframe id="game" src="./game.html" title="乌坦城" allow="autoplay; fullscreen"></iframe>
<div class="hud title">乌坦城 · 剑影前厅</div>
<div class="hud subtitle">真身未至 · 剑影先行</div>
<div class="hud hint">A / D 行走　空格 起跳　J 出剑</div>
<div class="hud bottom">
  <div class="status" id="status">正在牵引真身 · 请先以剑影守门</div>
  <div class="bar"><i id="bar"></i></div>
</div>
<div class="hud keys">剑影只是前厅 · 真身抵达后自动入城</div>
<div class="reveal" id="reveal"><div class="tip">真身已至</div><button id="enter">进入乌坦城</button></div>
<script>
(() => {
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  const game = document.getElementById('game');
  const statusEl = document.getElementById('status');
  const barEl = document.getElementById('bar');
  const reveal = document.getElementById('reveal');
  const enter = document.getElementById('enter');
  let W = 0, H = 0, dpr = 1;
  let x = .5, dir = 0, jumpY = 0, jumpV = 0, grounded = true, slash = 0, foot = 0, last = performance.now();
  let revealed = false, hasGame = false, progress = 0, lastStatus = '', running = true;
  const keys = new Set();

  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', resize); resize();

  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (['a','d','arrowleft','arrowright',' ','j','w'].includes(k)) e.preventDefault();
    keys.add(k);
    if (k === ' ' || k === 'w') { if (grounded) { jumpV = -620; grounded = false; } }
    if (k === 'j' && slash <= 0) slash = .42;
  }, { passive: false });
  addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
  addEventListener('blur', () => keys.clear());

  function drawLantern(px, py, r, a) {
    const g = ctx.createRadialGradient(px, py, 0, px, py, r * 3.2);
    g.addColorStop(0, 'rgba(255,221,142,' + a + ')');
    g.addColorStop(.22, 'rgba(255,183,83,' + (a * .7) + ')');
    g.addColorStop(1, 'rgba(255,140,40,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px, py, r * 3.2, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffd98e'; ctx.beginPath(); ctx.arc(px, py, r, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(255,230,170,.55)'; ctx.lineWidth = .8; ctx.beginPath(); ctx.arc(px, py, r + 2, 0, 7); ctx.stroke();
  }

  function drawTown(t) {
    const hy = H * .405;
    const sky = ctx.createLinearGradient(0, 0, 0, hy);
    sky.addColorStop(0, '#150e1f'); sky.addColorStop(.55, '#2a1b2a'); sky.addColorStop(1, '#3b292c');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, hy);
    const moon = ctx.createRadialGradient(W * .76, H * .18, 0, W * .76, H * .18, W * .2);
    moon.addColorStop(0, 'rgba(240,220,180,.22)'); moon.addColorStop(.35, 'rgba(240,200,130,.08)'); moon.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = moon; ctx.fillRect(0, 0, W, hy);
    ctx.fillStyle = 'rgba(255,232,182,.75)'; ctx.beginPath(); ctx.arc(W * .76, H * .18, Math.max(14, W * .018), 0, 7); ctx.fill();

    // 远山与城楼
    ctx.fillStyle = '#221827';
    ctx.beginPath(); ctx.moveTo(0, hy); ctx.lineTo(W * .18, hy - H * .055); ctx.lineTo(W * .35, hy); ctx.lineTo(0, hy); ctx.fill();
    ctx.beginPath(); ctx.moveTo(W, hy); ctx.lineTo(W * .78, hy - H * .045); ctx.lineTo(W * .62, hy); ctx.lineTo(W, hy); ctx.fill();
    ctx.fillStyle = '#1d1422';
    ctx.beginPath(); ctx.moveTo(W * .42, hy); ctx.lineTo(W * .5, hy - H * .09); ctx.lineTo(W * .58, hy); ctx.fill();
    ctx.fillStyle = '#120d17'; ctx.fillRect(W * .47, hy, W * .06, H * .035);

    // 地面
    const ground = ctx.createLinearGradient(0, hy, 0, H);
    ground.addColorStop(0, '#4a3c3c'); ground.addColorStop(.28, '#3a2e34'); ground.addColorStop(1, '#211a25');
    ctx.fillStyle = ground; ctx.beginPath(); ctx.moveTo(0, hy); ctx.lineTo(W, hy); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();
    ctx.strokeStyle = 'rgba(210,190,160,.09)'; ctx.lineWidth = 1;
    for (let i = -8; i <= 8; i++) {
      const bx = W * .5 + i * W * .085;
      ctx.beginPath(); ctx.moveTo(bx, hy); ctx.lineTo(W * .5 + i * W * .19, H); ctx.stroke();
    }
    for (let i = 0; i < 7; i++) {
      const p = (i / 7) ** 1.7;
      const y = hy + p * (H - hy);
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    // 街心灯影与摊贩剪影
    const laneGlow = ctx.createRadialGradient(W * .5, H * .62, 0, W * .5, H * .62, W * .34);
    laneGlow.addColorStop(0, 'rgba(255,190,120,.10)'); laneGlow.addColorStop(1, 'rgba(255,150,60,0)');
    ctx.fillStyle = laneGlow; ctx.fillRect(0, hy, W, H - hy);
    const stall = (sx, sy, sc, side) => {
      ctx.save(); ctx.translate(sx, sy); ctx.scale(sc, sc);
      ctx.fillStyle = 'rgba(20,12,18,.9)';
      ctx.fillRect(-26, -2, 52, 5);
      ctx.fillStyle = side ? '#4a2328' : '#3f2026';
      ctx.beginPath(); ctx.moveTo(-34, -36); ctx.lineTo(34, -36); ctx.lineTo(27, -20); ctx.lineTo(-27, -20); ctx.fill();
      ctx.fillStyle = 'rgba(10,7,12,.9)'; ctx.fillRect(-22, -20, 3, 19); ctx.fillRect(18, -20, 3, 19);
      ctx.fillStyle = 'rgba(255,180,95,.28)'; ctx.beginPath(); ctx.arc(0, -13, 9, 0, 7); ctx.fill();
      ctx.restore();
    };
    stall(W * .28, H * .585, .95, 0);
    stall(W * .72, H * .60, .9, 1);
    stall(W * .19, H * .76, 1.45, 0);
    stall(W * .81, H * .78, 1.4, 1);
    // 檐角前景
    ctx.fillStyle = 'rgba(8,5,11,.95)';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(W * .17, 0); ctx.lineTo(W * .1, H * .035); ctx.lineTo(0, H * .06); ctx.fill();
    ctx.beginPath(); ctx.moveTo(W, 0); ctx.lineTo(W * .83, 0); ctx.lineTo(W * .9, H * .035); ctx.lineTo(W, H * .06); ctx.fill();

    // 两侧楼
    const build = (side) => {
      const s = side === 'l' ? -1 : 1;
      const edge = side === 'l' ? 0 : W;
      const inner = side === 'l' ? W * .23 : W * .77;
      ctx.fillStyle = '#2a1c22';
      ctx.beginPath(); ctx.moveTo(edge, hy + H * .025); ctx.lineTo(inner, hy + H * .01); ctx.lineTo(inner + s * W * .02, H * .92); ctx.lineTo(edge, H); ctx.fill();
      ctx.fillStyle = '#171017';
      ctx.beginPath(); ctx.moveTo(edge, hy + H * .02); ctx.lineTo(inner, hy); ctx.lineTo(inner - s * W * .045, hy - H * .025); ctx.lineTo(edge - s * W * .02, hy + H * .005); ctx.fill();
      ctx.strokeStyle = 'rgba(240,210,150,.16)'; ctx.lineWidth = 1;
      for (let i = 0; i < 5; i++) {
        const px = edge + (inner - edge) * (i / 5);
        const py = hy + H * .04 + i * H * .005;
        ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, py + H * .03); ctx.stroke();
      }
      for (let i = 0; i < 3; i++) {
        const lx = edge + (inner - edge) * (.25 + i * .27);
        ctx.fillStyle = 'rgba(255,185,95,.5)'; ctx.fillRect(lx, hy + H * .012, 2, 3);
      }
      drawLantern(side === 'l' ? W * .1 : W * .9, hy - H * .005, W * .006, .55);
      drawLantern(side === 'l' ? W * .18 : W * .82, hy + H * .015, W * .005, .45);
    };
    build('l'); build('r');

    // 中央灯笼串
    for (let i = 0; i < 5; i++) {
      const lx = W * (.34 + i * .08);
      const ly = hy - H * .018 + Math.sin(i * 1.8) * 2;
      drawLantern(lx, ly, W * .0035, .4);
    }
  }

  function drawSwordsman(px, py, s, flip, walk, jump, cut) {
    ctx.save(); ctx.translate(px, py); ctx.scale(flip ? -s : s, s);
    const bob = walk ? Math.sin(foot * 9) * 2.2 : Math.sin(performance.now() / 1600) * 1.2;
    ctx.translate(0, bob);
    ctx.fillStyle = 'rgba(0,0,0,.32)'; ctx.beginPath(); ctx.ellipse(0, 5, 18, 5, 0, 0, 7); ctx.fill();
    // 冰翼残影：三束碎冰棱
    ctx.lineWidth = .7;
    for (let k = 0; k < 3; k++) {
      const len = 24 + k * 6, lift = -62 - k * 5, drop = -46 + k * 5;
      ctx.fillStyle = 'rgba(150,215,245,' + (.20 - k * .04) + ')';
      ctx.strokeStyle = 'rgba(190,235,255,' + (.42 - k * .08) + ')';
      ctx.beginPath(); ctx.moveTo(-5, -54); ctx.lineTo(-9 - len, lift); ctx.lineTo(-12 - k * 2, drop); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(150,215,245,' + (.20 - k * .04) + ')';
      ctx.strokeStyle = 'rgba(190,235,255,' + (.42 - k * .08) + ')';
      ctx.beginPath(); ctx.moveTo(5, -54); ctx.lineTo(8 + len * .8, lift + 3); ctx.lineTo(11 + k * 2, drop); ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    // 腿
    const leg = walk ? Math.sin(foot * 9) * 4 : 0;
    ctx.strokeStyle = '#1c202b'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-3, -16); ctx.lineTo(-5 - leg, 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(3, -16); ctx.lineTo(5 + leg, 2); ctx.stroke();
    // 长袍
    ctx.fillStyle = '#dce6f0';
    ctx.beginPath(); ctx.moveTo(-9, -44); ctx.lineTo(9, -44); ctx.lineTo(12, -18); ctx.lineTo(6, -9); ctx.lineTo(-7, -9); ctx.lineTo(-12, -18); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#8fb3d8'; ctx.beginPath(); ctx.moveTo(-9, -44); ctx.lineTo(-2, -44); ctx.lineTo(-4, -12); ctx.lineTo(-12, -18); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#31455f'; ctx.fillRect(-10, -31, 20, 3);
    // 上身
    ctx.fillStyle = '#e8f0f7'; ctx.beginPath(); ctx.moveTo(-8, -43); ctx.lineTo(8, -43); ctx.lineTo(7, -58); ctx.lineTo(-7, -58); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#39506d'; ctx.beginPath(); ctx.moveTo(-6, -43); ctx.lineTo(0, -43); ctx.lineTo(0, -58); ctx.lineTo(-7, -58); ctx.closePath(); ctx.fill();
    // 手臂
    ctx.strokeStyle = '#dce6f0'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(-7, -56); ctx.lineTo(-13, -38 + (cut > 0 ? -10 : 0)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(7, -56); ctx.lineTo(14, -38 + (cut > 0 ? -8 : 0)); ctx.stroke();
    // 剑
    ctx.strokeStyle = '#e8eef4'; ctx.lineWidth = 2.2;
    if (cut > 0) {
      ctx.save(); ctx.translate(12, -37); ctx.rotate(-.95);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -34); ctx.stroke();
      ctx.strokeStyle = 'rgba(200,230,255,.55)'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(12, -6, 30, -1.7, -.25); ctx.stroke();
      ctx.restore();
    } else {
      ctx.beginPath(); ctx.moveTo(12, -38); ctx.lineTo(17, -18); ctx.stroke();
      ctx.strokeStyle = '#c0a46a'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(9, -40); ctx.lineTo(15, -35); ctx.stroke();
    }
    // 头与发
    ctx.fillStyle = '#e3b18c'; ctx.beginPath(); ctx.arc(0, -66, 6.5, 0, 7); ctx.fill();
    ctx.fillStyle = '#0d0d12'; ctx.beginPath(); ctx.arc(0, -69, 7.2, Math.PI, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-6, -69); ctx.lineTo(-8, -51); ctx.lineTo(-2, -62); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(6, -69); ctx.lineTo(8, -56); ctx.lineTo(3, -65); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(8,8,12,.9)'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(3, -66); ctx.quadraticCurveTo(9, -55, 7, -43); ctx.stroke();
    ctx.restore();
  }

  function draw(t) {
    if (!running) return;
    const dt = Math.min(.033, (t - last) / 1000); last = t;
    const speed = 2.2;
    if (keys.has('a') || keys.has('arrowleft')) { dir = -1; x -= speed * dt; }
    else if (keys.has('d') || keys.has('arrowright')) { dir = 1; x += speed * dt; }
    else dir = 0;
    x = Math.max(.16, Math.min(.84, x));
    if (!grounded) { jumpV += 1500 * dt; jumpY += jumpV * dt; if (jumpY > 0) { jumpY = 0; jumpV = 0; grounded = true; } }
    if (dir) foot += dt * 2.5;
    if (slash > 0) slash -= dt;
    drawTown(t);
    const px = W * x, py = H * .725 + jumpY;
    drawSwordsman(px, py, Math.min(1.75, W / 640), dir < 0, !!dir, jumpY, slash);
    if (running) requestAnimationFrame(draw);
  }

  function setStatus(s) {
    if (s && s !== lastStatus) { lastStatus = s; statusEl.textContent = s; }
  }
  function poll() {
    try {
      const w = game.contentWindow;
      const h = w && w.__dpcq && w.__dpcq.hero && w.__dpcq.hero();
      if (h && h.status) {
        setStatus(h.status);
        const m = /(\d+)%/.exec(h.status);
        if (m) progress = Math.max(progress, +m[1]);
      } else if (w && w.__dpcq && w.__dpcq.GS && w.__dpcq.GS.ready) {
        progress = Math.max(progress, 99);
      }
      if (w && w.__dpcq && w.__dpcq.GS && w.__dpcq.GS.ready) {
        setStatus('真身已至 · 剑影退散');
        progress = 100;
        barEl.style.width = '100%';
        if (!revealed) { revealed = true; setTimeout(showGame, 380); }
        return;
      }
    } catch (e) {}
    barEl.style.width = Math.max(12, progress) + '%';
    setTimeout(poll, 500);
  }
  function showGame() {
    reveal.classList.add('on');
    setTimeout(() => {
      running = false;
      canvas.style.opacity = '0';
      canvas.style.pointerEvents = 'none';
      game.style.zIndex = '2';
      game.style.opacity = '1'; game.style.pointerEvents = 'auto';
      document.querySelectorAll('.hud').forEach(el => el.style.opacity = '0');
      setTimeout(() => { canvas.style.display = 'none'; }, 620);
    }, 500);
    setTimeout(() => { try { game.contentWindow.focus(); } catch (e) {} }, 700);
    reveal.classList.remove('on');
    enter.onclick = () => { reveal.classList.remove('on'); try { game.contentWindow.focus(); } catch (e) {} };
  }
  enter.onclick = () => { reveal.classList.remove('on'); try { game.contentWindow.focus(); } catch (e) {} };
  requestAnimationFrame(draw);
  game.addEventListener('load', () => { hasGame = true; });
  setTimeout(poll, 700);
})();
</script>
</body>
</html>
